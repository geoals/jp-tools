<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>コトデックス</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Stamp the saved theme before first paint. A module runs after the
         document is parsed, which is late enough to flash light on a dark
         device, so this one small thing is inline and blocking. -->
    <script>
        try {
            var t = localStorage.getItem("read-stats-theme");
            if (t === "light" || t === "dark")
                document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="importmap">
    {
        "imports": {
            "preact": "https://esm.sh/preact@10.25.4",
            "preact/hooks": "https://esm.sh/preact@10.25.4/hooks",
            "htm/preact": "https://esm.sh/htm@3.1.1/preact?deps=preact@10.25.4",
            "@preact/signals": "https://esm.sh/@preact/signals@1.3.1?deps=preact@10.25.4"
        }
    }
    </script>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
