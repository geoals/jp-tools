<!doctype html>
<meta charset="utf-8" />
<title>overlay</title>
<!--
  The line being read, and a dictionary popup for the word clicked in it — the
  page behind vn-mine's layer-shell strip over the VN.

  Not `#read` with things hidden: this one is over the game, so anything that is
  not the line is in the way. No feed, no header, no controls. The backdrop
  carries the translucency and the text stays fully opaque, so the art shows
  through without the words fading with it.

  The surface is the whole screen but only the box at the bottom is painted, so
  a popup has somewhere to open into. Everything above the box is transparent,
  and takes no clicks either while the overlay is passing them through.
-->
<link rel="stylesheet" href="/shared/popup.css" />
<style>
  :root {
    --backdrop: rgba(0, 0, 0, 0.82);
    --strip: 300px;
    --line-font: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    /* `?scale=` — everything below is in `rem` or in `em` under something that
       is, so one root font-size takes the whole overlay with it. The few
       viewport-relative lengths carry the factor themselves. */
    --scale: 1;

    /* The game window, pushed from the shell. Zero size means it was not found
       — no name set on the work, no xdotool, or a Wayland-native game — and the
       line keeps the screen-relative placement below. */
    --game-x: 0px;
    --game-y: 0px;
    --game-w: 0px;
    --game-h: 0px;

    /* Where the game draws its own text, as fractions of that window rather
       than of the screen, so the line follows a resize instead of having to be
       re-measured. These reproduce the placement measured off this VN at
       1920x1080 fullscreen; another game wants its own, found with the drag.
       `--text-y` is the top of the line's content box, not of the ink: leading
       and side bearing are the font's business and already in the numbers. */
    --text-x: 0.227;
    --text-y: 0.7916;
    --text-size: 0.03056;

    /* The type settings, set from the cogwheel and stored per browser. They are
       multipliers and offsets on the measured placement above rather than
       lengths of their own, so a line drawn bigger or looser still starts where
       `--text-x` puts it. Default to no change at all. */
    --line-scale: 1;
    --line-leading: 1.68;
    --line-tracking: 0em;
    --line-weight: 400;
    --line-color: #fff;
    --line-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    /* How loudly a status is painted. Ghost mode derives its own wash from it
       rather than carrying a second setting — the two are one decision about
       how strong a mark should be. */
    --tint: 0.85;

    /* Where the game breaks the line, in characters. Not a fraction of the
       window: the game wraps on a character count, and the type is sized off
       the window's *height*, so a width fraction measured at 16:9 draws a
       column too narrow at 4:3 and breaks a line the game did not. */
    --text-chars: 40;
  }

  html {
    font-size: calc(16px * var(--scale));
  }

  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    color: #fff;
    font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
  }

  /* Placed on top of where the VN draws its own text rather than near it,
     measured off a screenshot of this one: first glyph at x=442, ink top at
     y=874, ~32px tall on a 1920x1080 screen. The padding assumes the default
     300px strip, which puts its top edge at y=780; changing VN_OVERLAY_HEIGHT
     moves the line by the same amount. */
  /* Positioning only — the backdrop is on #line, so it wraps the text itself
     rather than painting a band across a box most of which is empty. The left
     inset and top padding are both pulled back by #line's own padding, which
     keeps the first glyph exactly where it was measured to sit. */
  #box {
    position: absolute;
    /* The insets shrink as the type grows: a line drawn much larger than the
       game's own would wrap inside a column sized for the game's. */
    left: calc(22.7vw / var(--scale) - 0.7rem);
    right: calc(23vw / var(--scale));
    bottom: 0;
    height: var(--strip);
    display: flex;
    align-items: flex-start;
    box-sizing: border-box;
    padding: 4.23rem 0 0;
    font-family: var(--line-font);
    font-size: calc(clamp(1.35rem, calc(1.82vw * var(--scale)), 2.25rem) * var(--line-scale));
    /* Tuned against the game's own line spacing, which the strip sits over. */
    line-height: var(--line-leading);
    font-weight: var(--line-weight);
    color: var(--line-color);
    text-shadow: var(--line-shadow);
    /* Set by the drag — see moveBy(). The strip is a layer surface pinned to
       every screen edge, so repositioning it means moving the content inside
       the surface, not the window. */
    transform: translate(var(--dx, 0px), var(--dy, 0px));
  }
  /* `display: flex` above wins over the attribute on its own. */
  #box[hidden] {
    display: none;
  }

  /* The game window is known, so the line is placed off it rather than off the
     screen: moving or resizing the game carries the line along, and a different
     resolution needs no re-measuring. `--text-*` are fractions of that window,
     so the type scales with it too.

     The box is pulled back by #line's own padding — restated here in `em` so it
     scales with the type — which leaves the first glyph exactly where
     `--text-x` puts it. */
  html[data-aligned] #box {
    left: calc(var(--game-x) + var(--text-x) * var(--game-w) - 0.311em);
    top: calc(var(--game-y) + var(--text-y) * var(--game-h) - 0.2em);
    right: auto;
    bottom: auto;
    /* 1em per CJK glyph plus #line's `letter-spacing`, then #line's padding. */
    width: calc(var(--text-chars) * (1em + var(--line-tracking)) + 0.622em);
    height: auto;
    padding: 0;
    font-size: calc(var(--text-size) * var(--game-h) * var(--line-scale));
  }

  html[data-aligned] #line {
    padding: 0.2em 0.311em;
  }

  /* Ghost: the game's own text is what is read, and the overlay adds only the
     marks over it and somewhere to click. The status tints stay — they are
     backgrounds, the same shape the hover tint has — while the glyphs, the
     backdrop and the shadow go, so nothing is drawn twice. Needs
     `[data-aligned]`: without the game's geometry the line is not over the
     game's text, and hiding it would leave marks floating on nothing. */
  html[data-ghost] #line {
    background: transparent;
    color: transparent;
    text-shadow: none;
  }

  /* The tints sit *over* the game's glyphs here rather than under the overlay's
     own, so they have to wash the word rather than fill it: at the weight they
     carry normally they bury the text they are marking. Lighter and much more
     transparent, near the hover tint's weight — which needs no change on a word
     with no status, since it was always drawn over something readable.
     Hover moves the alpha rather than replacing the colour: the status rules
     outrank `.w:hover`, and a hover that won outright would drop the word's
     status for as long as it is the word being reached for. */
  html[data-ghost] .w {
    --wash: calc(var(--tint) * 0.33);
  }
  html[data-ghost] .w:hover {
    --wash: calc(var(--tint) * 0.65);
  }
  html[data-ghost] .w.new {
    background: hsl(211 70% 52% / var(--wash));
  }
  html[data-ghost] .w.seen {
    background: hsl(276 48% 55% / var(--wash));
  }
  html[data-ghost] .w.unknown {
    background: hsl(28 70% 50% / var(--wash));
  }

  /* Scaled up, the line is read off the screen rather than fitted over the
     game's own text, so it goes to the bottom edge: nothing of the game is
     worth covering less, and the popup gets the whole screen above it. Left
     edge, not centred — centring moves the first glyph with every change in
     line length, so the eye has to find where the line starts again. */
  /* Nothing of the game is being read through the line at phone size, so the
     backdrop stops being a compromise and just makes the text legible. */
  html[data-mobile] {
    --backdrop: rgba(0, 0, 0, 0.92);
  }

  html[data-mobile] #box {
    left: 0;
    right: 0;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 0 0.7rem;
  }

  #line {
    /* The game's own soft breaks arrive as newlines, so the line is drawn the
       shape it has on screen. Wrapping still applies past the overlay width. */
    white-space: pre-wrap;
    width: fit-content;
    max-width: 100%;
    max-height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 0.45rem 0.7rem;
    border-radius: 10px;
    background: var(--backdrop);
    /* The game's font is a touch wider per character at the same size, so the
       overlaid line drifts left of it across a long line. The default makes up
       the difference; the cogwheel moves it from there. */
    letter-spacing: var(--line-tracking);
  }

  /* A line of speech is set with its later rows under the first character, not
     under the opening bracket, which is how the game sets it. The padding moves
     every row in by one character and the negative indent pulls the first one
     back out, so the 「 stays exactly where the line starts and only the rows
     after a break — the game's own, or a wrap — are indented. One character is
     1em *plus* the letter spacing, which is the bracket's whole advance. */
  #line.quoted {
    padding-left: calc(0.7rem + 1em + var(--line-tracking));
    text-indent: calc(-1em - var(--line-tracking));
  }
  html[data-aligned] #line.quoted {
    padding-left: calc(0.311em + 1em + var(--line-tracking));
  }

  /* Furigana the game drew with the line. `line-height: 1` on the reading keeps
     it inside the leading the line already has, so a line with furigana sits at
     the same height as one without — the strip is aligned to the game's text
     and must not shift under it. */
  ruby > rt {
    font-size: 0.5em;
    line-height: 1;
    opacity: 0.85;
    text-shadow: none;
  }

  /* One span per word the tokenizer found. Nothing is drawn until the pointer
     is on one — a permanent box per word would be a wall of them, and the hint
     is only needed for the word being reached for. */
  .w {
    border-radius: 3px;
    cursor: pointer;
    /* The tint has to clear the glyphs, and how much room a font leaves around
       its own ink varies — Noto's side bearings looked like padding, a tighter
       face has none. Vertical only: this is an inline box, so vertical padding
       paints without moving anything, while horizontal padding would either
       widen the line off the game's own text or need a negative margin, which
       overlaps the neighbouring span and mis-hits the word being mined. */
    padding: 0.14em 0;
  }
  .w:hover {
    background: rgba(255, 255, 255, 0.16);
  }

  /* The same hues as the reader's marks (base.css), dark ramp only — this
     always sits over a game. `known` gets no mark at all: on a line where most
     words are known, the absence is what makes the rest readable. */
  .w.new {
    background: hsl(211 62% 33% / var(--tint));
  }
  .w.seen {
    background: hsl(276 38% 29% / var(--tint));
  }
  .w.unknown {
    background: hsl(28 55% 31% / var(--tint));
  }
  /* A common word not known is underlined on top of its tint — not knowing a
     rare word is expected, not knowing a common one is the gap worth seeing. */
  .w.common {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
  }
  /* The underline takes its colour from the text, which ghost mode makes
     transparent — and the underline is a mark, not a glyph, so it has to stay.
     White, as it is when the line draws its own words: the status tints own the
     hues, and a coloured underline would read as a status of its own. */
  html[data-ghost] .w.common {
    text-decoration-color: rgba(255, 255, 255, 0.85);
  }
  /* The word the popup is about. A ring, not a fill: the fills are the status
     scale, and the word being read about has to stay legible as `new`, `seen`
     or `unknown` — including while a button in the popup changes it. */
  .w.open {
    box-shadow: 0 0 0 2px #fff;
  }

  /* `left` and `bottom` are set per word — see place() — and this is only
     where it sits before the first one.

     Drawn at 125%: the line is glanced at, a definition is read. Every length
     in the popup and its parts carries that factor, so they stay in
     proportion — the 明鏡 rules further down are in `em` and follow on their
     own. */
  /* The popup's own rules — the frame, the head, and several hundred lines
     of per-dictionary structured-content styling — are in
     `web-shared/popup.css`, loaded above and shared with yt-mine. Only its
     placement over the strip is here, since that is the one part that is
     about this surface. */
  .jp-popup {
    bottom: var(--strip);
  }

  /* Silent while the capture pipeline is healthy. It only speaks up to explain
     why no line is arriving, which is the one failure invisible from here. */
  #warn {
    position: absolute;
    right: 0.8rem;
    bottom: calc(var(--strip) - 1.3rem);
    color: hsl(28 92% 72%);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
  }

  /* The model's read on the last line, and the button that asks for it. Placed
     and dragged on its own, not off #box: the line box is fitted over the
     game's text and this has to be able to sit where the game has nothing.

     Anchored at the top with the button above the panel, so the answer grows
     downwards into empty screen. Anchored at the bottom it grew upwards, and a
     streamed answer then crept up the screen line by line as it was being
     read. */
  #explain-box {
    position: absolute;
    left: 1rem;
    top: 1rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 0.4rem;
    max-width: min(60rem, 78vw);
    transform: translate(var(--ex, 0px), var(--ey, 0px));
  }

  #bar {
    display: flex;
    /* Stretch, so the handle is exactly as tall as the row of buttons beside
       it whatever their glyphs do to the line box. */
    align-items: stretch;
    gap: 0.4rem;
  }

  #buttons {
    display: flex;
    gap: 0.4rem;
  }
  /* Collapsed is the resting state: six buttons over a game are six things in
     the way of the art, and the handle is the one that has to stay reachable
     because it is also what the whole widget is dragged by. Only the handle
     opens and shuts it — a bar that closed itself took the button out from
     under the pointer reaching for it. */
  #buttons[hidden] {
    display: none;
  }

  /* Solid, where the buttons are translucent: it is the one control that is
     always there, and it is what the widget is dragged by. */
  #bar > #bar-handle {
    background: #000;
  }
  /* Paused is the one state worth seeing while the bar is shut — nothing being
     read is being counted. */
  #bar-handle.paused {
    color: hsl(28 92% 72%);
  }

  /* Own tooltip rather than `title`. QtWebEngine's native one is a separate
     surface the layer shell does not place, and it wraps to a width nothing
     here can set. */
  [data-tip] {
    position: relative;
  }
  [data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    top: calc(100% + 0.4rem);
    left: 0;
    z-index: 5;
    width: max-content;
    max-width: 22rem;
    padding: 0.4rem 0.6rem;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.92);
    color: #e6e6e6;
    font-size: 0.85rem;
    line-height: 1.35;
    text-align: left;
    white-space: normal;
    pointer-events: none;
  }

  #bar-handle,
  #explain-btn,
  #hide-btn,
  #scrollback-btn,
  #settings-btn {
    flex: none;
    /* Square, and all one size: they sit in a row over the game, and a glyph
       that happens to be wide must not make its button wider. */
    width: 2.6rem;
    height: 2.6rem;
    padding: 0;
    border: none;
    border-radius: 8px;
    background: rgba(0, 0, 0, 0.82);
    color: #e6e6e6;
    display: flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    /* The drag is the same gesture as the press, told apart by whether the
       pointer moved — so the browser's own text selection must not start. */
    user-select: none;
    touch-action: none;
  }
  #explain-btn:disabled {
    opacity: 0.45;
    cursor: default;
  }
  #hide-btn.off {
    color: #9a9a9a;
  }
  #settings-btn.off {
    color: #9a9a9a;
  }
  /* Paused is the state worth seeing from across the room: nothing being read
     is being counted. Coloured rather than dimmed, unlike the other toggles. */
  #pause-btn.paused {
    color: hsl(28 92% 72%);
  }

  /* The overlay's settings. Sits under the buttons like the explain panel, so
     it is inside #explain-box's rectangle and the shell already takes its
     clicks. Three tabs, because the questions are different: how the line is
     set, where it sits, and what is marked on it. */
  #settings-foot {
    display: flex;
    justify-content: flex-end;
  }

  #settings-panel {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
    padding: 0.9rem 1.1rem;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.9);
    color: #e6e6e6;
    font-size: 0.95rem;
  }
  #settings-panel[hidden] {
    display: none;
  }

  #settings-tabs {
    display: flex;
    gap: 0.3rem;
  }
  #settings-tabs button {
    padding: 0.25rem 0.7rem;
    border: none;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.1);
    color: #b9b9b9;
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #settings-tabs button.on {
    background: rgba(154, 140, 255, 0.55);
    color: #fff;
  }

  .settings-body {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.5rem 0.7rem;
  }
  .settings-body[hidden] {
    display: none;
  }
  .settings-body input[type="range"] {
    width: 11rem;
    accent-color: #9a8cff;
  }
  .settings-body input[type="checkbox"] {
    justify-self: start;
    width: 1rem;
    height: 1rem;
    accent-color: #9a8cff;
  }
  .settings-body input[type="number"],
  .settings-body input[type="text"] {
    width: 6rem;
    padding: 0.15rem 0.35rem;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.06);
    color: #e6e6e6;
    font: inherit;
    font-size: 0.9rem;
  }
  /* A URL, not a number: it needs the row rather than a box sized for four
     digits. */
  .settings-body input[type="text"] {
    width: 100%;
    box-sizing: border-box;
  }
  /* Tabular figures: the readout is beside a slider being dragged, and a
     proportional 1 makes the whole row twitch as the number changes. */
  .settings-body output {
    min-width: 3.2rem;
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: #b9b9b9;
  }
  /* A row whose control needs the whole width, and one that is only a note. */
  .settings-body .wide {
    grid-column: 2 / -1;
  }
  .settings-body .note {
    grid-column: 1 / -1;
    max-width: 26rem;
    margin: 0;
    color: #9a9a9a;
    font-size: 0.85rem;
    line-height: 1.5;
  }

  /* Chips, not a <select>: the dropdown is a native popup window, and a layer
     surface has none to open it in — the list simply never appeared. The same
     goes for the colour, which would otherwise want the native picker. */

  #mobile-btn,
  #pause-btn {
    padding: 0.25rem 0.7rem;
    border: none;
    border-radius: 6px;
    background: rgba(255, 255, 255, 0.14);
    color: #e6e6e6;
    font: inherit;
    font-size: 0.9rem;
    cursor: pointer;
  }
  #mobile-btn {
    justify-self: start;
  }
  /* Paused is the state worth seeing from across the room: nothing being read
     is being counted. Coloured rather than dimmed, unlike the other toggles. */
  #pause-btn.paused {
    color: hsl(28 92% 72%);
  }

  /* The hue slider paints the choice it is making. The native track has to be
     turned off first, or the gradient is painted behind it and never seen. */
  .settings-body input.hue {
    appearance: none;
    height: 0.55rem;
    background: linear-gradient(
      to right,
      hsl(0 100% 50%),
      hsl(60 100% 50%),
      hsl(120 100% 50%),
      hsl(180 100% 50%),
      hsl(240 100% 50%),
      hsl(300 100% 50%),
      hsl(360 100% 50%)
    );
    border-radius: 4px;
  }
  .settings-body input.hue::-webkit-slider-thumb {
    appearance: none;
    width: 0.9rem;
    height: 0.9rem;
    border: 2px solid #fff;
    border-radius: 50%;
    background: transparent;
    cursor: pointer;
  }
  /* The three that make one colour, boxed so they read as one control. */
  .settings-body .group {
    display: grid;
    grid-column: 1 / -1;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 0.4rem 0.7rem;
    padding: 0.5rem 0.6rem;
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 8px;
  }
  .group-head {
    color: #b9b9b9;
  }

  #colour-swatch {
    width: 1.6rem;
    height: 1.6rem;
    justify-self: end;
    border: 1px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    background: var(--line-color);
  }

  /* Every Japanese font on the machine, so the list is as long as the machine
     makes it — scrolled, not wrapped across the game. */
  /* Block, not a flex column: as a column the rows shrink to fit the box —
     thirty families came out as slivers a few pixels tall with the text gone,
     and nothing overflowed, so it never scrolled either. */
  #set-font {
    max-width: 21rem;
    max-height: 14rem;
    overflow-y: auto;
    scrollbar-width: thin;
  }
  /* Rows are divs, not buttons: a button stays inline-level whatever `display`
     says, and the list came out two names to a line. */
  #set-line-source .row,
  #set-font .row {
    overflow: hidden;
    padding: 0.25rem 0.5rem;
    border-radius: 5px;
    color: #b9b9b9;
    font-size: 0.95rem;
    white-space: nowrap;
    text-overflow: ellipsis;
    cursor: pointer;
    user-select: none;
  }
  #set-line-source .row:hover,
  #set-font .row:hover {
    background: rgba(255, 255, 255, 0.1);
  }
  #set-line-source .row.on,
  #set-font .row.on {
    background: rgba(154, 140, 255, 0.55);
    color: #fff;
  }
  /* The name is read, so it is set in the panel's own face — a display font
     renders its own name too fine to pick out of a list. The sample beside it
     is what shows the face, at one width so the names line up. */
  #set-font .sample {
    display: inline-block;
    width: 4rem;
    font-size: 1.1rem;
    color: #e6e6e6;
  }

  /* Earlier lines, under the button that opens them.
     
     Inside #explain-box, so it is placed against the bar, moves with the drag,
     and is already inside the rectangle report() hands the shell — a panel the
     compositor does not know about takes no clicks, and the game would advance
     under the line being read.

     Set like the line, because it *is* the line a minute ago: the same face,
     the same size, the same spacing. Only the shadow is dropped — that exists
     to lift a glyph off the game's artwork, and here there is a solid panel
     behind it. */
  #scrollback {
    box-sizing: border-box;
    /* The column the line is drawn in, so a line that fitted on screen fits
       here without rewrapping. Measured off #box rather than derived: the box
       is sized two different ways — the character count when it is aligned to
       the game, viewport insets when it is not — and only one of those can be
       written here. See sizeScrollback(). */
    width: var(--sb-width, calc(var(--text-chars) * (1em + var(--line-tracking)) + 1.4em));
    max-width: 78vw;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.92);
    font-family: var(--line-font);
    font-size: calc(clamp(1.35rem, calc(1.82vw * var(--scale)), 2.25rem) * var(--line-scale));
    font-weight: var(--line-weight);
    line-height: var(--line-leading);
    color: var(--line-color);
    letter-spacing: var(--line-tracking);
  }
  html[data-aligned] #scrollback {
    font-size: calc(var(--text-size) * var(--game-h) * var(--line-scale));
  }
  #scrollback[hidden] {
    display: none;
  }
  #scrollback-lines {
    /* About fourteen lines, and scroll inside for the rest. Measured in the
       panel's own line-height so it holds the same number of lines whatever
       the type is set to. */
    max-height: calc(14 * var(--line-leading) * 1em);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
    padding: 0.5em 0.7em;
    overscroll-behavior: contain;
  }
  /* The game's own soft breaks arrive as newlines, the same as in #line. */
  #scrollback-lines .sb {
    margin: 0 0 0.35em;
    padding: 0 0.2em;
    border-radius: 4px;
    white-space: pre-wrap;
  }
  #scrollback-lines .sb:last-child {
    margin-bottom: 0;
  }
  /* The line that is on screen right now, so scrolling back has somewhere to
     come home to. */
  #scrollback-lines .sb.current {
    background: rgba(154, 140, 255, 0.16);
  }
  /* Chrome, not content: sized in rem so it stays small when the line is set
     large. */
  #scrollback-foot {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    padding: 0.35rem 0.7rem;
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    font-family: system-ui, sans-serif;
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: normal;
    line-height: 1.4;
  }
  #scrollback-count {
    flex: 1;
    color: #9a9a9a;
  }
  #scrollback-foot button {
    padding: 0.15rem 0.5rem;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.06);
    color: #e6e6e6;
    font: inherit;
    cursor: pointer;
  }
  #scrollback-foot button:hover {
    background: rgba(255, 255, 255, 0.14);
  }

  #explain-panel {
    max-height: 60vh;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 0.9rem 1.2rem;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.9);
    color: #f2f2f2;
    font-size: 1.15rem;
    line-height: 1.7;
  }
  #explain-panel[hidden] {
    display: none;
  }
  #explain-panel.err {
    color: hsl(28 92% 72%);
  }
  #explain-panel p {
    margin: 0 0 0.5rem;
  }
  #explain-panel ul {
    margin: 0 0 0.5rem;
    padding-left: 1.1rem;
  }
  #explain-panel :last-child {
    margin-bottom: 0;
  }
</style>

<div id="box"><div id="line"></div></div>
<div id="popup" class="jp-popup" hidden></div>
<div id="explain-box">
  <div id="bar">
    <button id="bar-handle" data-tip="Overlay controls — drag to move">☰</button>
    <div id="buttons">
      <button id="explain-btn" data-tip="Explain the last line (select a word first to focus on it)">ℹ</button>
      <button id="hide-btn" data-tip="Hide the line">👁</button>
      <button id="scrollback-btn" class="off" data-tip="Earlier lines">▤</button>
      <button id="settings-btn" class="off" data-tip="Settings">⚙</button>
    </div>
  </div>
  <div id="settings-panel" hidden>
    <div id="settings-tabs">
      <button value="text" class="on">Text</button>
      <button value="place">Placement</button>
      <button value="marks">Marks</button>
      <button value="source">Source</button>
    </div>

    <div class="settings-body" data-tab="text">
      <label for="set-size">Font size</label>
      <input id="set-size" type="range" min="0.6" max="2" step="0.05" />
      <output id="out-size"></output>
      <label for="set-leading">Line height</label>
      <input id="set-leading" type="range" min="1" max="3" step="0.02" />
      <output id="out-leading"></output>
      <label for="set-tracking">Horizontal spacing</label>
      <input id="set-tracking" type="range" min="-0.05" max="0.3" step="0.005" />
      <output id="out-tracking"></output>
      <label for="set-weight">Font weight</label>
      <input id="set-weight" type="range" min="200" max="900" step="100" />
      <output id="out-weight"></output>
      <label for="set-backdrop">Backdrop</label>
      <input id="set-backdrop" type="range" min="0" max="1" step="0.02" />
      <output id="out-backdrop"></output>
      <label for="set-shadow">Shadow strength</label>
      <input id="set-shadow" type="range" min="0" max="6" step="1" />
      <output id="out-shadow"></output>
      <label for="set-shadow-blur">Shadow spread</label>
      <input id="set-shadow-blur" type="range" min="0" max="16" step="0.5" />
      <output id="out-shadow-blur"></output>
      <div class="group">
        <span class="group-head">Colour</span>
        <span></span>
        <span id="colour-swatch"></span>
        <label for="set-hue">Hue</label>
        <input id="set-hue" type="range" min="0" max="360" step="1" class="hue" />
        <output id="out-hue"></output>
        <label for="set-sat">Saturation</label>
        <input id="set-sat" type="range" min="0" max="100" step="1" />
        <output id="out-sat"></output>
        <label for="set-light">Lightness</label>
        <input id="set-light" type="range" min="20" max="100" step="1" />
        <output id="out-light"></output>
      </div>
      <span>Font</span>
      <div id="set-font" class="wide"></div>
    </div>

    <div class="settings-body" data-tab="place" hidden>
      <label for="set-chars">Column width</label>
      <input id="set-chars" type="range" min="16" max="80" step="1" />
      <output id="out-chars"></output>
      <label for="set-mobile-scale">Phone scale</label>
      <input id="set-mobile-scale" type="range" min="1.1" max="3" step="0.05" />
      <output id="out-mobile-scale"></output>
      <span>Phone size</span>
      <button id="mobile-btn" data-tip="Switch to phone size">⤢ Switch</button>
      <span></span>
    </div>

    <div class="settings-body" data-tab="marks" hidden>
      <label for="set-status">Status marks</label>
      <input id="set-status" type="checkbox" />
      <span></span>
      <label for="set-mark-new">Paint new</label>
      <input id="set-mark-new" type="checkbox" />
      <span></span>
      <label for="set-mark-seen">Paint seen</label>
      <input id="set-mark-seen" type="checkbox" />
      <span></span>
      <label for="set-mark-unknown">Paint unknown</label>
      <input id="set-mark-unknown" type="checkbox" />
      <span></span>
      <label for="set-tint">Tint strength</label>
      <input id="set-tint" type="range" min="0.1" max="1" step="0.05" />
      <output id="out-tint"></output>
      <label for="set-common">Common word threshold</label>
      <input id="set-common" type="number" min="0" step="500" />
      <span></span>
      <label for="set-ghost">Ghost mode</label>
      <input id="set-ghost" type="checkbox" />
      <span id="ghost-why"></span>
    </div>

    <div class="settings-body" data-tab="source" hidden>
      <label>Lines come from</label>
      <div id="set-line-source" class="wide">
        <div class="row" data-source="ws">Textractor WebSocket</div>
        <div class="row" data-source="clipboard">The clipboard</div>
      </div>
      <span></span>
      <label for="set-ws-url">WebSocket address</label>
      <input id="set-ws-url" type="text" spellcheck="false" />
      <span></span>
      <label></label>
      <div id="source-note" class="wide note"></div>
      <span></span>
    </div>

    <div id="settings-foot">
      <button id="pause-btn" data-tip="Pause capture">⏸ Pause capture</button>
    </div>
  </div>
  <div id="scrollback" hidden>
    <div id="scrollback-lines"></div>
    <div id="scrollback-foot">
      <span id="scrollback-count"></span>
      <button id="scrollback-latest">Latest</button>
    </div>
  </div>
  <div id="explain-panel" hidden></div>
</div>
<div id="warn"></div>
<script type="module" src="/overlay/overlay.js"></script>
