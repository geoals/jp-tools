<!doctype html>
<meta charset="utf-8" />
<title>overlay</title>
<!--
  The line being read, and a dictionary popup for the word clicked in it — the
  page behind vn-mine's layer-shell strip over the VN.

  Not `#read` with things hidden: this one is over the game, so anything that is
  not the line is in the way. No feed, no header, no controls. The backdrop
  carries the translucency and the text stays fully opaque, so the art shows
  through without the words fading with it.

  The surface is the whole screen but only the box at the bottom is painted, so
  a popup has somewhere to open into. Everything above the box is transparent,
  and takes no clicks either while the overlay is passing them through.
-->
<style>
  :root {
    --backdrop: rgba(0, 0, 0, 0.55);
    --strip: 300px;
  }

  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    color: #fff;
    font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
  }

  /* Placed on top of where the VN draws its own text rather than near it,
     measured off a screenshot of this one: first glyph at x=442, ink top at
     y=874, ~32px tall on a 1920x1080 screen. The padding assumes the default
     300px strip, which puts its top edge at y=780; changing VN_OVERLAY_HEIGHT
     moves the line by the same amount. */
  /* Positioning only — the backdrop is on #line, so it wraps the text itself
     rather than painting a band across a box most of which is empty. The left
     inset and top padding are both pulled back by #line's own padding, which
     keeps the first glyph exactly where it was measured to sit. */
  #box {
    position: absolute;
    left: calc(22.7vw - 0.7rem);
    right: 23vw;
    bottom: 0;
    height: var(--strip);
    display: flex;
    align-items: flex-start;
    box-sizing: border-box;
    padding: 4.23rem 0 0;
    font-size: clamp(1.35rem, 1.82vw, 2.25rem);
    line-height: 1.8;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
  }

  #line {
    width: fit-content;
    max-width: 100%;
    max-height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 0.45rem 0.7rem;
    border-radius: 10px;
    background: var(--backdrop);
  }

  /* One span per word the tokenizer found. Nothing is drawn until the pointer
     is on one — a permanent box per word would be a wall of them, and the hint
     is only needed for the word being reached for. */
  .w {
    border-radius: 3px;
    cursor: pointer;
  }
  .w:hover {
    background: rgba(255, 255, 255, 0.16);
  }

  /* The same hues as the reader's marks (base.css), dark ramp only — this
     always sits over a game. `known` gets no mark at all: on a line where most
     words are known, the absence is what makes the rest readable. */
  .w.new {
    background: hsl(211 62% 33% / 0.85);
  }
  .w.seen {
    background: hsl(276 38% 29% / 0.85);
  }
  .w.unknown {
    background: hsl(28 55% 31% / 0.85);
  }
  /* A common word not known is underlined on top of its tint — not knowing a
     rare word is expected, not knowing a common one is the gap worth seeing. */
  .w.common {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
  }
  .w.open {
    background: rgba(96, 165, 250, 0.42);
  }

  #popup {
    position: absolute;
    bottom: calc(var(--strip) + 12px);
    width: min(33rem, 46vw);
    min-height: 7rem;
    max-height: min(46vh, 460px);
    overflow-y: auto;
    box-sizing: border-box;
    padding: 0.7rem 0.85rem 0.8rem;
    border: 1px solid #2b3040;
    border-radius: 10px;
    /* Opaque: a definition read against moving artwork is unreadable. */
    background: #14161d;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.8);
    font-size: 0.88rem;
    line-height: 1.55;
    text-shadow: none;
  }
  #popup[hidden] {
    display: none;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    flex-wrap: wrap;
    padding-bottom: 0.4rem;
    margin-bottom: 0.4rem;
    border-bottom: 1px solid #232838;
  }
  .term {
    font-size: 1.2rem;
  }
  /* Downstep, as Yomitan writes it: [0] heiban, [1] atamadaka, [n] falling
     after the nth mora. */
  .pitch {
    color: #93c5fd;
    font-size: 0.8rem;
  }
  .reading {
    color: #9ca3af;
  }
  /* Two lists, two answers: Jiten ranks the word in the fiction being read,
     BCCWJ in newspaper and government prose. They disagree by an order of
     magnitude on ordinary words, which is why both are shown. */
  .rank {
    margin-left: auto;
    color: #9ca3af;
    font-size: 0.82rem;
    white-space: nowrap;
  }

  /* Which dictionary is showing, and the way to the next one. */
  .dictbar {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 0.5rem;
  }
  .paging {
    display: flex;
    gap: 0.2rem;
    margin-left: auto;
  }
  .paging button {
    width: 1.4rem;
    padding: 0 0.2rem;
    border: 1px solid #2b3040;
    border-radius: 4px;
    background: #1b1f29;
    color: #cbd5e1;
    font: inherit;
    line-height: 1.3;
    cursor: pointer;
  }
  .paging button:hover:not(:disabled) {
    background: #262c3a;
  }
  .paging button:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .dict {
    margin-top: 0;
    color: #7f8ea3;
    font-size: 0.72rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .body {
    font-size: 1.02rem;
  }
  .sense {
    margin: 0.15rem 0 0;
    padding-left: 0.2rem;
  }
  .sense li {
    margin: 0.12rem 0;
  }
  .none {
    color: #9ca3af;
  }

  .actions {
    display: flex;
    gap: 0.4rem;
    margin-top: 0.7rem;
    padding-top: 0.6rem;
    border-top: 1px solid #232838;
  }
  .actions button {
    flex: 1;
    padding: 0.35rem 0.5rem;
    border: 1px solid #2b3040;
    border-radius: 6px;
    background: #1b1f29;
    color: #cbd5e1;
    font: inherit;
    font-size: 0.78rem;
    cursor: pointer;
  }
  .actions button:hover {
    background: #262c3a;
  }
  .actions button.done {
    border-color: rgba(96, 165, 250, 0.5);
    color: #93c5fd;
  }

  /* Both dictionaries ship Yomitan *structured content*: HTML tagged with
     data-content/data-class attributes that carries no styling of its own.
     Yomitan supplies that from its own stylesheet plus a styles.css inside the
     dictionary zip, and neither travels with the definition — which is why the
     raw markup reads as "1.(1)nounsuffix". These rules are the same ones the
     Anki card type uses, so a definition looks the same in both places. */
  #popup img {
    display: none;
  }
  #popup a {
    color: #93c5fd;
    text-decoration: none;
  }

  /* The dictionaries bring their own numbering; the list markers would be a
     second one on top of it. */
  #popup ol {
    list-style-type: none;
  }
  #popup ul {
    padding-left: 1.6rem;
  }
  #popup ol ol li {
    list-style-type: none !important;
  }
  #popup ol ol > li > ul > li {
    list-style-type: disc !important;
  }
  #popup ol ol > li > ul {
    padding-left: 1.6rem !important;
  }
  /* Jitendex's star icon, and its JMdict | Tatoeba links. */
  #popup ol > li > i,
  #popup [data-content="attribution"],
  #popup div[data-sc-content="attribution"] {
    display: none;
  }

  /* Part-of-speech badges, so "nounsuffix" reads as two tags. */
  #popup [data-class="tag"] {
    display: inline-block;
    margin-right: 0.25em;
    padding: 0.15em 0.35em;
    border-radius: 0.3em;
    background-color: #3a4152;
    color: #e5e7eb;
    font-size: 0.72em;
    font-weight: bold;
    vertical-align: text-bottom;
    word-break: keep-all;
  }

  #popup [data-content="glossary"] ul,
  #popup ul[data-content="glossary"]:has(li:only-child) {
    padding-left: 0;
    list-style-type: none;
  }
  #popup ul[data-content="sense-groups"] {
    padding-left: 1rem;
    list-style-type: none;
  }
  #popup [data-content="extra-info"] {
    margin-left: 0.5em;
  }

  /* Example sentences as their own block, Japanese larger than the gloss. */
  #popup [data-content="example-sentence"] {
    margin: 0.4rem 0;
    padding: 0.4rem 0.5rem;
    border-left: 2px solid #3a4152;
    border-radius: 0.4rem;
    background-color: rgba(255, 255, 255, 0.05);
  }
  #popup [data-content="example-sentence-a"] {
    font-size: 1.25em;
  }
  #popup [data-content="example-keyword"] {
    color: #5ec45e;
  }
  #popup [data-content="example-sentence-b"] {
    font-size: 0.85em;
    color: #9ca3af;
  }

  /* Silent while the capture pipeline is healthy. It only speaks up to explain
     why no line is arriving, which is the one failure invisible from here. */
  #warn {
    position: absolute;
    right: 0.8rem;
    bottom: calc(var(--strip) - 1.3rem);
    color: hsl(28 92% 72%);
    font-size: 0.75rem;
    letter-spacing: 0.04em;
  }
</style>

<div id="box"><div id="line"></div></div>
<div id="popup" hidden></div>
<div id="warn"></div>
<script type="module" src="/static/overlay.js"></script>
