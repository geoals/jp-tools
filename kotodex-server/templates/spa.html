<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>コトデックス</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Stamp the saved theme before first paint. A module runs after the
         document is parsed, which is late enough to flash light on a dark
         device, so this one small thing is inline and blocking. -->
    <script>
        try {
            var t = localStorage.getItem("kotodex-theme");
            if (t === "light" || t === "dark")
                document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
    </script>
</head>
<body>
    <div id="app"></div>
    <script type="importmap">
    {
        "imports": {
            "preact": "/shared/vendor/preact.module.js",
            "preact/hooks": "/shared/vendor/preact-hooks.module.js",
            "htm": "/shared/vendor/htm.module.js",
            "htm/preact": "/shared/vendor/htm-preact.module.js",
            "@preact/signals": "/shared/vendor/preact-signals.module.js",
            "@preact/signals-core": "/shared/vendor/preact-signals-core.module.js"
        }
    }
    </script>
    <script type="module" src="/static/app.js"></script>
</body>
</html>
