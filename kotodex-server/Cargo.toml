[package]
name = "kotodex-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
dotenvy = "0.15"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
async-stream = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-native-roots"] }
jp-core = { path = "../jp-core" }
# The card fields and the CompactDef gloss. NOT `jp_mine_core::export` — an
# overlay card goes through `services::card::add_note` like every other.
jp-mine-core = { path = "../jp-mine-core" }
# The reader's font list and the mine notification, in process rather than by
# shelling out to `fc-list` and `notify-send`: one fewer tool to have installed,
# and neither of those two exists off Linux.
fontdb = "0.24.0"
ttf-parser = "0.25.1"
notify-rust = "4.18.0"

[target.'cfg(windows)'.dependencies]
# The window picker, in `services::desktop::win32`. Linux asks `xdotool`, which
# the overlay needs anyway; Windows has no such tool to shell out to.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[target.'cfg(windows)'.build-dependencies]
# Stamps the icon into the executable. Nothing outside the build can: a shortcut's
# icon is the shortcut's, so the process and its taskbar entry stayed blank.
winresource = "0.1"

[dev-dependencies]
# Drives the router directly in tests (`oneshot`), so an endpoint can be
# exercised end to end without binding a port.
tower = { version = "0.5", features = ["util"] }
# Builds a two-page epub in memory for the book-logging test.
zip = "2"
