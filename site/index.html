<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotodex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
/* The app's own palette, from web-shared/theme.css. The demo is one click
   away and the two should not look like different products. */
:root {
  color-scheme: light;
  --page: hsl(60 11.1% 94.7%);
  --text-primary: hsl(0 0% 4.3%);
  --text-secondary: hsl(45 2.5% 31.4%);
  --muted: hsl(45 3.3% 52.2%);
  --border-strong: hsl(52 12% 82%);
  --accent: hsl(212.8 67.7% 50.2%);
  --accent-ink: hsl(0 0% 100%);
  --shadow: 0 10px 34px hsl(0 0% 0% / 12%);
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: hsl(0 0% 5.1%);
    --text-primary: hsl(0 0% 100%);
    --text-secondary: hsl(45 9.1% 74.1%);
    --muted: hsl(45 3.3% 52.2%);
    --border-strong: hsl(226 20% 21%);
    --accent: hsl(212.8 76.8% 56.1%);
    --accent-ink: hsl(216 100% 96%);
    --shadow: 0 10px 34px hsl(0 0% 0% / 60%);
  }
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 28px;
  padding: 48px 24px;
  text-align: center;
  background: var(--page);
  color: var(--text-primary);
  font-family: Inter, "Noto Sans JP", system-ui, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

.title { display: flex; flex-direction: column; }

h1 {
  margin: 2px 0 0;
  font-family: "Noto Sans JP", Inter, sans-serif;
  font-size: clamp(36px, 8vw, 56px);
  font-weight: 700;
  letter-spacing: 0.04em;
}

.mark {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
}

.tagline {
  margin: 0;
  max-width: 30rem;
  color: var(--text-secondary);
  font-size: clamp(16px, 2.4vw, 18px);
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
}

.btn {
  display: inline-block;
  padding: 12px 24px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 15px;
  text-decoration: none;
  border: 1px solid transparent;
}

.btn-primary {
  background: var(--accent);
  color: var(--accent-ink);
  box-shadow: var(--shadow);
}

.btn-secondary {
  background: transparent;
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.downloads {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  width: 100%;
  max-width: 29rem;
}

.download {
  display: inline-flex;
  align-self: center;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  background: transparent;
  color: var(--text-primary);
  font-weight: 500;
  font-size: 13px;
  text-decoration: none;
}

.download:hover { border-color: var(--accent); }

.command {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 7px 12px;
  border: 1px dashed var(--border-strong);
  border-radius: 8px;
  background: transparent;
  color: var(--text-primary);
  font: inherit;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}

.command:hover { border-color: var(--accent); }
.command code { flex: 1; overflow-x: auto; white-space: nowrap; }
.command .meta {
  flex: none;
  color: var(--muted);
  font-family: Inter, sans-serif;
  font-size: 11.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.note {
  margin: 0;
  font-size: 13.5px;
  color: var(--muted);
}
</style>
</head>
<body>

<div class="title">
  <p class="mark">Kotodex</p>
  <h1>コトデックス</h1>
</div>

<!-- The description goes here. -->
<p class="tagline">A reading log for Japanese.</p>

<div class="downloads">
  <a class="download" id="win" href="https://github.com/geoals/kotodex/releases/latest">
    Download for Windows 64-bit
  </a>
  <button class="command" id="copy" type="button" title="Copy the install command">
    <code>curl -fsSL https://kotodex.com/install.sh | sh</code>
    <span class="meta" id="copy-state">Linux</span>
  </button>
</div>

<div class="actions">
  <a class="btn btn-primary" href="https://demo.kotodex.com">Try the demo</a>
  <a class="btn btn-secondary" href="https://github.com/geoals/kotodex">GitHub</a>
</div>

<script>
const copy = document.getElementById('copy');
const state = document.getElementById('copy-state');
copy.addEventListener('click', async () => {
  await navigator.clipboard.writeText(copy.querySelector('code').textContent);
  state.textContent = 'copied';
  setTimeout(() => { state.textContent = 'Linux'; }, 1600);
});

// The Windows asset carries the version in its name, so there is no stable
// /releases/latest/download/ URL. Unresolved, the tag stays on the releases
// page, which is one extra click rather than a dead link.
fetch('https://api.github.com/repos/geoals/kotodex/releases/latest')
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(release => {
    const exe = release.assets.find(a => a.name.endsWith('-setup.exe'));
    if (exe) document.getElementById('win').href = exe.browser_download_url;
  })
  .catch(() => {});
</script>

</body>
</html>
