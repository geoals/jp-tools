<!doctype html>
<meta charset="utf-8" />
<title>overlay</title>
<!--
  The line being read, and a dictionary popup for the word clicked in it — the
  page behind vn-mine's layer-shell strip over the VN.

  Not `#read` with things hidden: this one is over the game, so anything that is
  not the line is in the way. No feed, no header, no controls. The backdrop
  carries the translucency and the text stays fully opaque, so the art shows
  through without the words fading with it.

  The surface is the whole screen but only the box at the bottom is painted, so
  a popup has somewhere to open into. Everything above the box is transparent,
  and takes no clicks either while the overlay is passing them through.
-->
<style>
  :root {
    --backdrop: rgba(0, 0, 0, 0.88);
    --strip: 300px;
    --line-font: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
    /* `?scale=` — everything below is in `rem` or in `em` under something that
       is, so one root font-size takes the whole overlay with it. The few
       viewport-relative lengths carry the factor themselves. */
    --scale: 1;
  }

  html {
    font-size: calc(16px * var(--scale));
  }

  html,
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: transparent;
    color: #fff;
    font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
  }

  /* Placed on top of where the VN draws its own text rather than near it,
     measured off a screenshot of this one: first glyph at x=442, ink top at
     y=874, ~32px tall on a 1920x1080 screen. The padding assumes the default
     300px strip, which puts its top edge at y=780; changing VN_OVERLAY_HEIGHT
     moves the line by the same amount. */
  /* Positioning only — the backdrop is on #line, so it wraps the text itself
     rather than painting a band across a box most of which is empty. The left
     inset and top padding are both pulled back by #line's own padding, which
     keeps the first glyph exactly where it was measured to sit. */
  #box {
    position: absolute;
    /* The insets shrink as the type grows: a line drawn much larger than the
       game's own would wrap inside a column sized for the game's. */
    left: calc(22.7vw / var(--scale) - 0.7rem);
    right: calc(23vw / var(--scale));
    bottom: 0;
    height: var(--strip);
    display: flex;
    align-items: flex-start;
    box-sizing: border-box;
    padding: 4.23rem 0 0;
    font-family: var(--line-font);
    font-size: clamp(1.35rem, calc(1.82vw * var(--scale)), 2.25rem);
    line-height: 1.8;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    /* Set by the drag — see moveBy(). The strip is a layer surface pinned to
       every screen edge, so repositioning it means moving the content inside
       the surface, not the window. */
    transform: translate(var(--dx, 0px), var(--dy, 0px));
  }

  /* Scaled up, the line is read off the screen rather than fitted over the
     game's own text, so it goes to the bottom edge: nothing of the game is
     worth covering less, and the popup gets the whole screen above it. Left
     edge, not centred — centring moves the first glyph with every change in
     line length, so the eye has to find where the line starts again. */
  html[data-mobile] #box {
    left: 0;
    right: 0;
    align-items: flex-end;
    justify-content: flex-start;
    padding: 0 0.7rem;
  }

  #line {
    width: fit-content;
    max-width: 100%;
    max-height: 100%;
    overflow-y: auto;
    scrollbar-width: none;
    padding: 0.45rem 0.7rem;
    border-radius: 10px;
    background: var(--backdrop);
  }

  /* One span per word the tokenizer found. Nothing is drawn until the pointer
     is on one — a permanent box per word would be a wall of them, and the hint
     is only needed for the word being reached for. */
  .w {
    border-radius: 3px;
    cursor: pointer;
    /* The tint has to clear the glyphs, and how much room a font leaves around
       its own ink varies — Noto's side bearings looked like padding, a tighter
       face has none. Vertical only: this is an inline box, so vertical padding
       paints without moving anything, while horizontal padding would either
       widen the line off the game's own text or need a negative margin, which
       overlaps the neighbouring span and mis-hits the word being mined. */
    padding: 0.14em 0;
  }
  .w:hover {
    background: rgba(255, 255, 255, 0.16);
  }

  /* The same hues as the reader's marks (base.css), dark ramp only — this
     always sits over a game. `known` gets no mark at all: on a line where most
     words are known, the absence is what makes the rest readable. */
  .w.new {
    background: hsl(211 62% 33% / 0.85);
  }
  .w.seen {
    background: hsl(276 38% 29% / 0.85);
  }
  .w.unknown {
    background: hsl(28 55% 31% / 0.85);
  }
  /* A common word not known is underlined on top of its tint — not knowing a
     rare word is expected, not knowing a common one is the gap worth seeing. */
  .w.common {
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 4px;
  }
  /* The word the popup is about. A ring, not a fill: the fills are the status
     scale, and the word being read about has to stay legible as `new`, `seen`
     or `unknown` — including while a button in the popup changes it. */
  .w.open {
    box-shadow: 0 0 0 2px #fff;
  }

  /* `left` and `bottom` are set per word — see place() — and this is only
     where it sits before the first one.

     Drawn at 125%: the line is glanced at, a definition is read. Every length
     in the popup and its parts carries that factor, so they stay in
     proportion — the 明鏡 rules further down are in `em` and follow on their
     own. */
  #popup {
    position: absolute;
    bottom: var(--strip);
    width: min(41.25rem, calc(57.5vw * var(--scale)));
    min-height: 8.75rem;
    max-height: min(57.5vh, calc(575px * var(--scale)));
    overflow-y: auto;
    box-sizing: border-box;
    padding: 0.875rem 1.06rem 1rem;
    border: 1px solid #2b3040;
    border-radius: 12px;
    /* Opaque: a definition read against moving artwork is unreadable. */
    background: #14161d;
    box-shadow: 0 10px 34px rgba(0, 0, 0, 0.8);
    font-size: 1.1rem;
    line-height: 1.55;
    text-shadow: none;
  }
  #popup[hidden] {
    display: none;
  }

  .head {
    display: flex;
    align-items: baseline;
    gap: 0.625rem;
    flex-wrap: wrap;
    padding-bottom: 0.5rem;
    margin-bottom: 0.5rem;
    border-bottom: 1px solid #232838;
  }
  .term {
    font-size: 1.5rem;
  }
  /* Downstep, as Yomitan writes it: [0] heiban, [1] atamadaka, [n] falling
     after the nth mora. */
  .pitch {
    color: #93c5fd;
    font-size: 1rem;
  }
  .reading {
    color: #9ca3af;
  }
  /* One pill per frequency list, split like Yomitan's: the name carries the
     fill, the number sits in the same outline unfilled. Same greys as the
     part-of-speech badges below, so the popup has one badge vocabulary. */
  .rank {
    display: flex;
    gap: 0.375rem;
    margin-left: auto;
    white-space: nowrap;
  }
  .freq {
    display: inline-flex;
    border: 1px solid #3a4152;
    border-radius: 0.3em;
    font-size: 0.9rem;
    line-height: 1.55;
  }
  .freq-name {
    padding: 0 0.4em;
    background-color: #3a4152;
    color: #e5e7eb;
    font-weight: bold;
  }
  .freq-value {
    padding: 0 0.4em;
    color: #cbd5e1;
  }

  /* The word is already a card. Green rather than the badge greys, because it
     answers a different question from the frequency pills beside it — and it
     is the one thing in the popup that leaves the overlay, so it is a button
     and looks like one. */
  .mined {
    padding: 0 0.4em;
    border: 1px solid rgba(94, 196, 94, 0.55);
    border-radius: 0.3em;
    background: rgba(94, 196, 94, 0.16);
    color: #86e086;
    font: inherit;
    font-size: 0.9rem;
    line-height: 1.55;
    cursor: pointer;
  }
  .mined:hover {
    background: rgba(94, 196, 94, 0.28);
  }

  /* Known, unknown, mine. One character each and the frequency pills' own
     metrics — same border, radius, size and line box — so the head reads as one
     row of badges rather than a toolbar bolted to it. */
  .acts {
    display: flex;
    gap: 0.375rem;
  }
  .acts button {
    padding: 0 0.5em;
    border: 1px solid #3a4152;
    border-radius: 0.3em;
    background: #1b1f29;
    color: #cbd5e1;
    font: inherit;
    font-size: 0.9rem;
    line-height: 1.55;
    cursor: pointer;
  }
  .acts button:hover {
    background: #262c3a;
  }
  /* The status the word is on now. */
  .acts button.on {
    border-color: #3f6ea8;
    background: #223247;
    color: #cfe3ff;
  }

  /* The other matches at this position — see expansions() in overlay.js. One
     chip per candidate, longest first. The row is drawn empty and filled when
     the scan lands, so it takes no room on the words that have no other
     reading, which is most of them. */
  .expansions:empty {
    display: none;
  }
  .expansions {
    display: flex;
    flex-wrap: wrap;
    gap: 0.375rem;
    margin-bottom: 0.5rem;
  }
  .expansions button {
    padding: 0 0.5em;
    border: 1px solid #3a4152;
    border-radius: 0.3em;
    background: #1b1f29;
    color: #cbd5e1;
    font: inherit;
    font-size: 1rem;
    cursor: pointer;
  }
  .expansions button:hover {
    background: #262c3a;
  }
  .expansions .none {
    color: #9ca3af;
    font-size: 0.9rem;
  }

  /* Which dictionary is showing, and the way to the next one. */
  .dictbar {
    display: flex;
    align-items: center;
    gap: 0.625rem;
    margin-top: 0.625rem;
  }
  .paging {
    display: flex;
    gap: 0.25rem;
    margin-left: auto;
  }
  .paging button {
    width: 1.75rem;
    padding: 0 0.25rem;
    border: 1px solid #2b3040;
    border-radius: 5px;
    background: #1b1f29;
    color: #cbd5e1;
    font: inherit;
    line-height: 1.3;
    cursor: pointer;
  }
  .paging button:hover:not(:disabled) {
    background: #262c3a;
  }
  .paging button:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .dict {
    margin-top: 0;
    color: #7f8ea3;
    font-size: 0.9rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .body {
    font-size: 1.275rem;
  }
  .sense {
    margin: 0.1875rem 0 0;
    padding-left: 0.25rem;
  }
  .sense li {
    margin: 0.15rem 0;
  }
  .none {
    color: #9ca3af;
  }

  /* Every dictionary here ships Yomitan *structured content*: HTML tagged with
     data-* attributes that carries no styling of its own. Yomitan supplies that
     from its own stylesheet plus a styles.css inside the dictionary zip, and
     neither travels with the definition — which is why the raw markup reads as
     "1.(1)nounsuffix". The rules below are that styling, rewritten for a popup
     that is always over a game rather than for white paper.

     They are scoped per dictionary because the attribute names collide:
     data-headword, data-red and data-num each mean something different in 明鏡
     and in 小学館. `data-dict` is the slug overlay.js puts on the body. */

  /* An inline image is standing in for a character — 三省堂 sets its part of
     speech markers and accent bars this way, and hiding them drops content.
     They are black or red line art drawn for paper: invert to bring them onto
     a dark background, then turn the hue back so a red bar stays red.

     The size has to be capped here: 明鏡's markers declare no dimensions and
     their SVGs carry no intrinsic size either, so without a height they fill
     the popup. A declared size arrives as an inline style and still wins. */
  #popup img {
    width: auto;
    height: 1em;
    vertical-align: -0.1em;
    filter: invert(1) hue-rotate(180deg);
  }
  /* Illustrations and stroke-order diagrams are pictures rather than
     characters: they get their own line, and paper-white behind them. */
  #popup img.dict-figure {
    display: block;
    max-width: 100%;
    height: auto;
    margin: 0.35rem 0;
    padding: 0.25rem;
    background: #fff;
    border-radius: 0.25rem;
    filter: none;
  }
  #popup a {
    color: #93c5fd;
    text-decoration: none;
  }

  /* The dictionaries bring their own numbering; the list markers would be a
     second one on top of it. */
  #popup ol {
    list-style-type: none;
  }
  #popup ul {
    padding-left: 2rem;
  }
  #popup ol ol li {
    list-style-type: none !important;
  }
  #popup ol ol > li > ul > li {
    list-style-type: disc !important;
  }
  #popup ol ol > li > ul {
    padding-left: 2rem !important;
  }
  /* Jitendex's star icon, and its JMdict | Tatoeba links. */
  #popup ol > li > i,
  #popup [data-content="attribution"],
  #popup div[data-sc-content="attribution"] {
    display: none;
  }

  /* Part-of-speech badges, so "nounsuffix" reads as two tags. */
  #popup [data-class="tag"] {
    display: inline-block;
    margin-right: 0.25em;
    padding: 0.15em 0.35em;
    border-radius: 0.3em;
    background-color: #3a4152;
    color: #e5e7eb;
    font-size: 0.72em;
    font-weight: bold;
    vertical-align: text-bottom;
    word-break: keep-all;
  }

  #popup [data-content="glossary"] ul,
  #popup ul[data-content="glossary"]:has(li:only-child) {
    padding-left: 0;
    list-style-type: none;
  }
  #popup ul[data-content="sense-groups"] {
    padding-left: 1rem;
    list-style-type: none;
  }
  #popup [data-content="extra-info"] {
    margin-left: 0.5em;
  }

  /* Example sentences as their own block, Japanese larger than the gloss. */
  #popup [data-content="example-sentence"] {
    margin: 0.4rem 0;
    padding: 0.4rem 0.5rem;
    border-left: 2px solid #3a4152;
    border-radius: 0.4rem;
    background-color: rgba(255, 255, 255, 0.05);
  }
  #popup [data-content="example-sentence-a"] {
    font-size: 1.25em;
  }
  #popup [data-content="example-keyword"] {
    color: #5ec45e;
  }
  #popup [data-content="example-sentence-b"] {
    font-size: 0.85em;
    color: #9ca3af;
  }

  /* One palette for all four, so a sense number means the same colour whichever
     dictionary is showing and the eye can find it without reading. The paper
     originals price their reds and pink boxes against white; these are the same
     distinctions at a brightness that survives being over a game. */
  #popup {
    --d-key: hsl(0 75% 70%); /* headword and the spellings beside it */
    --d-num: #e5e7eb; /* sense numbers — bold and plain, found by weight */
    --d-tag: #9fb3cc; /* part of speech, register, field labels */
    --d-note: #9ca3af; /* notes, cross references, anything secondary */
    --d-ex: #9aa3b2; /* example sentences, set off by their rule not a hue */
    --d-box: rgba(255, 255, 255, 0.06);
    --d-rule: #3a4152;
  }
  /* Ruby is a reading over a word in every dictionary here, and small in all
     of them. */
  #popup [data-rt],
  #popup rt {
    font-size: 0.55em;
    font-weight: normal;
    vertical-align: top;
  }
  /* Folded-away extras: 明鏡's 類語, 小学館's 筆順. */
  #popup details {
    margin: 0.5em 0;
  }
  #popup summary {
    width: max-content;
    color: var(--d-note);
    font-size: 0.85em;
    cursor: pointer;
  }

  /* --- 明鏡国語辞典 第三版 -------------------------------------------------
     It ships a styles.css keyed on `data-sc-*`; jp-core stores the same HTML
     without that prefix, so these are its rules under the names that arrive
     here. */
  [data-dict="明鏡国語辞典-第三版"] [data-red] {
    color: var(--d-key);
  }
  [data-dict="明鏡国語辞典-第三版"] [data-headword][data-カナ] {
    font-size: 1.15em;
    font-weight: bold;
  }
  [data-dict="明鏡国語辞典-第三版"] [data-headword][data-旧かな] {
    margin-left: 0.5em;
    color: var(--d-note);
    font-size: 0.7em;
  }
  [data-dict="明鏡国語辞典-第三版"] [data-head2] {
    margin-top: 0.25em;
  }
  /* The ❶ ❷ before each sense. */
  [data-dict="明鏡国語辞典-第三版"] [data-bc] {
    margin-right: 0.2em;
  }
  /* 書き方, 使い方, 注意, 品格 — the labels that head a usage note. */
  [data-dict="明鏡国語辞典-第三版"] [data-fbox] {
    display: inline-block;
    margin-right: 0.25em;
    padding: 0.05em 0.25em;
    border: 1px solid var(--d-key);
    border-radius: 0.2em;
    color: var(--d-key);
    font-size: 0.8em;
    word-break: keep-all;
  }
  [data-dict="明鏡国語辞典-第三版"] [data-column],
  [data-dict="明鏡国語辞典-第三版"] [data-hinkaku] {
    margin-top: 0.5em;
    padding: 0.25em 0.5em;
    border-radius: 0.4em;
    background: var(--d-box);
  }
  [data-dict="明鏡国語辞典-第三版"] [data-columntitle] {
    color: var(--d-key);
    font-weight: bold;
  }

  /* --- 三省堂国語辞典 第八版 -----------------------------------------------
     Sankoku names its structure in Japanese under a single `data-name`, and
     ships no colour or weight at all — which is why it arrives as one
     undifferentiated block. The entry is headword, then numbered senses of
     gloss and example, and these rules make those three findable. */
  [data-dict="三省堂国語辞典-第八版"] [data-name="見出部"] {
    font-size: 1.15em;
  }
  [data-dict="三省堂国語辞典-第八版"] [data-name="見出仮名"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="子見出仮名"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="句表記"] {
    font-weight: bold;
  }
  /* The 【犬】 spelling beside the reading. */
  [data-dict="三省堂国語辞典-第八版"] [data-name="表記G"] {
    color: var(--d-key);
  }
  [data-dict="三省堂国語辞典-第八版"] [data-name="表外字マーク"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="表外音訓マーク"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="歴史仮名"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="アクセント"] {
    color: var(--d-note);
    font-size: 0.75em;
  }
  /* 品詞, 使用域 (口語, 俗語…) and 専門 (the field a sense belongs to) are all
     labels on the sense rather than part of it. */
  [data-dict="三省堂国語辞典-第八版"] [data-name="品詞G"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="使用域G"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="専門G"] {
    margin: 0 0.25em;
    color: var(--d-tag);
    font-size: 0.8em;
    word-break: keep-all;
  }
  /* The number is the one thing worth finding without reading. */
  [data-dict="三省堂国語辞典-第八版"] [data-name="語義番号"] {
    margin-right: 0.15em;
    color: var(--d-num);
    font-weight: bold;
  }
  [data-dict="三省堂国語辞典-第八版"] [data-name="大語義"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="語義"] {
    display: block;
    margin-top: 0.3em;
  }
  /* 用例 runs on from the gloss on paper. Broken out, an entry stops being a
     wall: the definition is the line, the examples are under it. */
  [data-dict="三省堂国語辞典-第八版"] [data-name="用例G"] {
    display: block;
    margin: 0.25em 0 0.1em;
    padding-left: 0.5em;
    border-left: 2px solid var(--d-rule);
    color: var(--d-ex);
  }
  [data-dict="三省堂国語辞典-第八版"] [data-name="注記"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="注解"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="言換G"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="原綴"] {
    color: var(--d-note);
    font-size: 0.85em;
  }
  [data-dict="三省堂国語辞典-第八版"] [data-name="参照G"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="対義語G"] {
    color: #93c5fd;
    font-size: 0.85em;
  }
  [data-dict="三省堂国語辞典-第八版"] [data-name="red"] {
    color: var(--d-key);
  }
  [data-dict="三省堂国語辞典-第八版"] [data-name="ルビ"] {
    font-size: 0.55em;
    vertical-align: top;
  }
  /* A run-in subentry — 子見出 for a derived form, 句 for a phrase. Its own
     line, or it reads as the tail of the sense above it. */
  [data-dict="三省堂国語辞典-第八版"] [data-name="子見出部"],
  [data-dict="三省堂国語辞典-第八版"] [data-name="句見出部"] {
    display: block;
    margin-top: 0.4em;
  }

  /* --- 小学館例解学習国語 第十二版 ------------------------------------------
     A school dictionary, so an entry carries more than a gloss: the kanji's
     grade, radical and stroke count, illustrations, and a 使い分け box telling
     near-synonyms apart. Its markup names all of that, and the point of styling
     it is that those parts stay apart. */
  [data-dict="小学館例解学習国語-第十二版"] [data-headword] {
    font-size: 1.15em;
    font-weight: bold;
  }
  [data-dict="小学館例解学習国語-第十二版"] [data-標準表記] {
    color: var(--d-key);
  }
  [data-dict="小学館例解学習国語-第十二版"] [data-参考表記],
