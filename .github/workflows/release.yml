name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for the tarball name
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The tarball ships binaries, so the glibc it links against is the oldest
    # distro it will run on. Built in the container rather than on the runner
    # image, whose glibc moves when GitHub retires a label.
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2

      - name: Build the tarball
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          scripts/build-release.sh "$version"

      - name: Check the glibc floor
        # Raising this strands every LTS user, and the build itself gives no
        # sign of it.
        run: |
          for bin in target/release-artifact/*/target/release/*; do
            floor=$(objdump -T "$bin" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1)
            echo "$bin $floor"
            case "$floor" in
              GLIBC_2.3[0-5]) ;;
              *) echo "::error::$bin needs $floor, above the 2.35 floor"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@v4
        with:
          name: kotodex-tarball
          path: target/release-artifact/*.tar.gz*

  build-windows:
    runs-on: windows-latest
    # No container: they are painful on Windows runners and buy nothing here.
    # Rust and MSVC are preinstalled, and there is no glibc to hold a floor
    # against.
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install what freezing needs
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PySide6 websockets pyinstaller
          choco install innosetup --no-progress -y

      # One job for both artifacts: build-installer.ps1 runs build-release.ps1 for
      # the tree it needs, so the zip falls out of the same Rust build rather than
      # a second one.
      - name: Build the zip and the installer
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = "$env:GITHUB_REF_NAME" -replace '^v', '' }
          scripts\windows\build-installer.ps1 $version

      - uses: actions/upload-artifact@v4
        with:
          name: kotodex-windows
          path: |
            target/release-artifact/*.zip*
            target/release-artifact/*setup.exe*

  # Separate from the build because the build container has no gh.
  attach:
    needs: [build, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both artifacts, flattened into one directory: the upload below takes the
      # whole of it.
      - uses: actions/download-artifact@v4
        with:
          pattern: kotodex-*
          merge-multiple: true
          path: dist

      # Draft, so the notes and the assets are looked at before anyone can
      # download them. Publishing is a click.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --draft --title "$tag" \
                 --notes-file docs/release-notes.md --generate-notes
          gh release upload "$tag" dist/* --clobber
