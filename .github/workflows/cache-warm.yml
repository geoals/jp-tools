name: cache-warm

on:
  push:
    branches: [master]
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

concurrency:
  group: cache-warm
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-linux
      - run: |
          cargo build --release -p kotodex-server
          cargo build --release -p jp-core --bin jp-dict
          cargo build --release -p jp-mine-core --bin anki-setup

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
      - run: |
          cargo build --release -p kotodex-server --bin kotodex-server
          cargo build --release -p jp-core --bin jp-dict
          cargo build --release -p jp-mine-core --bin anki-setup
